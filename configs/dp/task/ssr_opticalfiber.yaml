name: ssr_opticalfiber_image

image_shape: &image_shape [3, 240, 320]

shape_meta: &shape_meta
  obs:
    camera_env:
      shape: *image_shape
      type: rgb
    camera_wrist:
      shape: *image_shape
      type: rgb
    arm_eef_pose:
      shape: [6]
      type: low_dim
    hand_joint_angles:
      shape: [15]
      type: low_dim
  action:
    shape: [21]

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: ssr.dataset.ssr_pickplace_image_dataset.SSRPickPlaceImageDataset
  shape_meta: *shape_meta
  dataset_path: data/opticalfiber/ryhand_opticalfiber_dataset.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  load_into_memory: false
  # "stratified_length" (default) splits val proportionally across episode-length
  # strata, ensuring short (subaction/recovery) and long (full task) episodes are
  # both represented in val. Use "random" to revert to the original behaviour.
  val_split_strategy: "random"
  val_split_n_strata: 4
